appId: com.interviewcopilot.app
productName: Interview Copilot
# Disable electron-builder's auto-publish. When a git tag is pushed in CI it
# would otherwise try to upload to a GitHub Release itself and demand
# GH_TOKEN. We let softprops/action-gh-release handle the upload step from
# the workflow instead — one publisher, no token plumbing here.
publish: null
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - package.json
  - "!**/*.map"
  - "!**/node_modules/**/{CHANGELOG.md,README.md,readme.md,LICENSE,LICENSE.md,license.md,*.d.ts}"

# koffi loads its native .node binaries via require() at runtime. When
# everything is packed into app.asar, Node can't open a .node file that
# lives inside an archive — it has to be on disk. asarUnpack extracts
# koffi to app.asar.unpacked/node_modules/koffi/ so the FFI call that
# applies WDA_EXCLUDEFROMCAPTURE works in the packaged build.
asarUnpack:
  - "**/node_modules/koffi/**"
win:
  target:
    # NSIS installer — the "normal" install path (Program Files / shortcut).
    - target: nsis
      arch: [x64]
    # Portable — single .exe that extracts to %TEMP% on launch. No registry,
    # no install dir, no admin prompt. Settings still persist via
    # app.getPath('userData') = %APPDATA%/interview-copilot/, so the user's
    # API key / JD / resume / answer style all survive across runs.
    - target: portable
      arch: [x64]
  # NOTE: per-target artifactName must live inside each target's own block
  # (nsis: / portable:) — not here at the win: level — otherwise both
  # outputs collide on the same filename.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup.${ext}
portable:
  artifactName: ${productName}-${version}-portable.${ext}
  # We don't ship a splash image; the extraction usually finishes in well
  # under a second so the user sees the main window almost immediately.
  # Leaving unpackDirName at its default (a per-build hash) means multiple
  # versions can run side-by-side without trampling each other's %TEMP%
  # extraction directory.
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.productivity
  artifactName: ${productName}-${version}-${arch}.${ext}
  # Privacy: capturing audio from the embedded webview does NOT require these
  # entitlements, but capturing the candidate's microphone does. ScreenCaptureKit
  # for system-wide audio (future) would also need NSScreenCaptureUsageDescription.
  extendInfo:
    NSMicrophoneUsageDescription: "Interview Copilot needs microphone access to transcribe what you say during your interview."
    NSCameraUsageDescription: "Camera access is not required; this declaration prevents getUserMedia from failing on systems with restrictive defaults."
